# Dependabot version updates — AgentSociety2 scope only.
#
# Legacy packages (agentsociety v1, community, benchmark) are intentionally
# excluded from version updates. Dependency-graph jobs may still scan their
# uv.lock files; keep those lockfiles patched, or dismiss leftover alerts as
# out-of-scope in GitHub Security.

version: 2

# Prefer not to feed dependency-graph alerts from archived packages.
graphs:
  exclude-paths:
    - packages/agentsociety/**
    - packages/agentsociety-community/**
    - packages/agentsociety-benchmark/**
    - packages/agentsociety/docs/**

updates:
  - package-ecosystem: pip
    directory: /packages/agentsociety2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - agentsociety2
      - dependencies

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - extension
      - dependencies

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - frontend
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - ci
      - dependencies
